<!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>مرحباً بك في الـ API</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            body {
                background-color: #0f172a;
                color: #f8fafc;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .card {
                background: #1e293b;
                padding: 2.5rem;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.3);
                text-align: center;
                max-width: 480px;
                width: 90%;
                border: 1px solid #334155;
            }
            .status-badge {
                display: inline-block;
                background-color: rgba(16, 185, 129, 0.1);
                color: #10b981;
                padding: 6px 16px;
                border-radius: 20px;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                border: 1px solid rgba(16, 185, 129, 0.2);
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.75rem;
                color: #ffffff;
            }
            p {
                color: #94a3b8;
                font-size: 0.95rem;
                line-height: 1.6;
                margin-bottom: 2rem;
            }
            .btn-container {
                display: flex;
                gap: 12px;
                justify-content: center;
            }
            .btn {
                text-decoration: none;
                padding: 10px 20px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 0.9rem;
                transition: all 0.2s ease;
            }
            .btn-primary {
                background-color: #3b82f6;
                color: #ffffff;
            }
            .btn-primary:hover {
                background-color: #2563eb;
            }
            .btn-secondary {
                background-color: #334155;
                color: #cbd5e1;
            }
            .btn-secondary:hover {
                background-color: #475569;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <span class="status-badge">● السيرفر يعمل بنجاح</span>
            <h1>مرحباً بك في خدمة الـ API</h1>
            <p>جميع الخدمات والـ Endpoints تعمل بشكل طبيعي. يمكنك استكشاف التوثيق والتفاعل مع الواجهات عبر الرابط أدناه.</p>
            <div class="btn-container">
                <a href="/docs" class="btn btn-primary">Swagger UI</a>
                <a href="/redoc" class="btn btn-secondary">ReDoc</a>
            </div>
        </div>
    </body>
    </html>
